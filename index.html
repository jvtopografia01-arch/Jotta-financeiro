<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#3b28cc">
  <title>Meu Financeiro</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    :root {
      --primary: #3b28cc;
      --primary-dark: #28199c;
      --bg: #f3f4fa;
      --card: #ffffff;
      --text: #181826;
      --muted: #66687a;
      --green: #16803c;
      --red: #c62828;
      --border: #e3e5f0;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
    }

    header {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: #fff;
      padding: 20px 16px;
      text-align: center;
    }

    header h1 {
      margin: 0 0 4px;
      font-size: 24px;
    }

    header p {
      margin: 0;
      font-size: 14px;
      opacity: 0.9;
    }

    main {
      max-width: 760px;
      margin: 0 auto;
      padding: 14px 14px 40px;
    }

    .nav-tabs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 14px;
    }

    .tab-btn {
      width: 100%;
      margin: 0;
      padding: 11px 8px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #fff;
      color: var(--text);
      font-weight: bold;
      font-size: 13px;
      cursor: pointer;
    }

    .tab-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    .tab-panel {
      display: none;
    }

    .tab-panel.active {
      display: block;
    }

    .month-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: #fff;
      padding: 10px 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      margin-bottom: 14px;
    }

    .month-bar select {
      width: auto;
      margin: 0;
      padding: 8px 12px;
      font-size: 14px;
      font-weight: bold;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 14px;
    }

    .card {
      background: var(--card);
      border-radius: 14px;
      padding: 14px 10px;
      text-align: center;
      border: 1px solid var(--border);
      box-shadow: 0 2px 8px #00000008;
    }

    .card span {
      font-size: 12px;
      color: var(--muted);
      font-weight: bold;
    }

    .card strong {
      display: block;
      margin-top: 6px;
      font-size: 17px;
    }

    .receita { color: var(--green); }
    .despesa { color: var(--red); }
    .saldo-pos { color: var(--primary); }
    .saldo-neg { color: var(--red); }

    section {
      background: var(--card);
      padding: 16px;
      border-radius: 14px;
      margin-bottom: 14px;
      border: 1px solid var(--border);
      box-shadow: 0 2px 8px #00000008;
    }

    h2 {
      color: var(--primary);
      font-size: 18px;
      margin: 0 0 12px;
    }

    .month-group-title {
      margin: 14px 0 6px;
      padding: 6px 10px;
      background: #f1effc;
      border-left: 4px solid var(--primary);
      border-radius: 6px;
      font-size: 14px;
      font-weight: bold;
      color: var(--primary-dark);
    }

    label {
      display: block;
      margin-top: 10px;
      font-weight: bold;
      font-size: 13px;
      color: #333;
    }

    input, select, button {
      width: 100%;
      padding: 11px 12px;
      margin-top: 5px;
      border: 1px solid #cfd3e6;
      border-radius: 9px;
      font-size: 15px;
      background: #fff;
      color: var(--text);
    }

    button {
      background: var(--primary);
      color: #fff;
      border: none;
      margin-top: 14px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: var(--primary-dark);
    }

    .row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .quick-box {
      background: #f6f5ff;
      border: 1px dashed var(--primary);
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 14px;
    }

    .quick-actions {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    .quick-actions button {
      margin-top: 0;
      padding: 10px;
      font-size: 14px;
    }

    .btn-secondary {
      background: #4b4e6d;
    }

    .btn-secondary:hover {
      background: #363850;
    }

    .btn-excluir {
      width: auto;
      padding: 6px 10px;
      margin: 4px 0 0;
      background: var(--red);
      font-size: 12px;
      border-radius: 7px;
    }

    .btn-abater {
      width: auto;
      padding: 6px 10px;
      margin: 4px 5px 0 0;
      background: var(--green);
      font-size: 12px;
      border-radius: 7px;
    }

    .btn-pendente {
      width: auto;
      padding: 6px 10px;
      margin: 4px 5px 0 0;
      background: #b45309;
      font-size: 12px;
      border-radius: 7px;
    }

    .btn-editar {
      width: auto;
      padding: 6px 10px;
      margin: 4px 5px 0 0;
      background: #2563eb;
      font-size: 12px;
      border-radius: 7px;
    }

    .item {
      border-bottom: 1px solid var(--border);
      padding: 12px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .item:last-child {
      border-bottom: none;
    }

    .item small {
      display: block;
      color: var(--muted);
      margin-top: 3px;
      font-size: 12px;
    }

    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: bold;
      background: #eceaff;
      color: var(--primary);
      margin-right: 5px;
    }

    .badge-pago {
      background: #dcfce7;
      color: var(--green);
    }

    .badge-aberto {
      background: #fee2e2;
      color: var(--red);
    }

    .cat-row {
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
    }

    .cat-row:last-child {
      border-bottom: none;
    }

    .cat-top {
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      font-weight: bold;
    }

    .bar-bg {
      height: 8px;
      background: #eceef7;
      border-radius: 999px;
      overflow: hidden;
      margin-top: 6px;
    }

    .bar-fill {
      height: 100%;
      background: var(--primary);
      border-radius: 999px;
    }

    .vazio {
      color: var(--muted);
      text-align: center;
      padding: 12px;
      font-size: 14px;
    }

    @media (max-width: 560px) {
      .nav-tabs {
        grid-template-columns: repeat(2, 1fr);
      }
      .cards, .row-2 {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>Meu Financeiro</h1>
    <p>Meses, categorias, empréstimos e lançamentos rápidos</p>
  </header>

  <main>
    <div class="nav-tabs">
      <button class="tab-btn active" onclick="abrirAba('mes', this)">Mês</button>
      <button class="tab-btn" onclick="abrirAba('categorias', this)">Categorias</button>
      <button class="tab-btn" onclick="abrirAba('emprestimos', this)">Empréstimos</button>
      <button class="tab-btn" onclick="abrirAba('dados', this)">Backup</button>
    </div>
