<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#075985">
  <title>Meu Financeiro</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #eef6ff;
      color: #123;
    }

    header {
      background: #075985;
      color: white;
      padding: 22px 16px;
      text-align: center;
    }

    header h1 {
      margin: 0 0 6px;
      font-size: 25px;
    }

    header p {
      margin: 0;
      opacity: 0.9;
    }

    main {
      max-width: 700px;
      margin: auto;
      padding: 16px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 18px;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 14px 8px;
      text-align: center;
      box-shadow: 0 2px 8px #0001;
    }

    .card strong {
      display: block;
      margin-top: 7px;
      font-size: 16px;
    }

    .receita {
      color: #16803c;
    }

    .despesa {
      color: #c62828;
    }

    .saldo {
      color: #075985;
    }

    section {
      background: white;
      padding: 16px;
      border-radius: 12px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px #0001;
    }

    h2 {
      color: #075985;
      font-size: 20px;
      margin-top: 0;
    }

    label {
      display: block;
      margin-top: 10px;
      font-weight: bold;
      font-size: 14px;
    }

    input, select, button {
      width: 100%;
      padding: 12px;
      margin-top: 5px;
      border: 1px solid #b8c8d8;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      background: #075985;
      color: white;
      border: none;
      margin-top: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #064b6e;
    }

    .btn-excluir {
      width: auto;
      padding: 7px 10px;
      margin: 0;
      background: #c62828;
      font-size: 13px;
    }

    .item {
      border-bottom: 1px solid #ddd;
      padding: 12px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .item:last-child {
      border-bottom: none;
    }

    .item small {
      display: block;
      color: #666;
      margin-top: 4px;
    }

    .vazio {
      color: #777;
      text-align: center;
      padding: 10px;
    }

    @media (max-width: 500px) {
      .cards {
        grid-template-columns: 1fr;
      }

      .card {
        padding: 12px;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>Meu Financeiro</h1>
    <p>Controle de receitas, despesas e dívidas</p>
  </header>

  <main>

    <div class="cards">
      <div class="card">
        Receitas
        <strong class="receita" id="totalReceitas">R$ 0,00</strong>
      </div>

      <div class="card">
        Despesas
        <strong class="despesa" id="totalDespesas">R$ 0,00</strong>
      </div>

      <div class="card">
        Saldo
        <strong class="saldo" id="saldoAtual">R$ 0,00</strong>
      </div>
    </div>

    <section>
      <h2>Novo lançamento</h2>

      <label for="descricao">Descrição</label>
      <input id="descricao" type="text" placeholder="Ex.: Salário, mercado, gasolina">

      <label for="valor">Valor</label>
      <input id="valor" type="number" step="0.01" placeholder="Ex.: 150">

      <label for="tipo">Tipo</label>
      <select id="tipo">
        <option value="receita">Receita</option>
        <option value="despesa">Despesa</option>
      </select>

      <label for="categoria">Categoria</label>
      <select id="categoria">
        <option>Salário</option>
        <option>Renda extra</option>
        <option>Alimentação</option>
        <option>Transporte</option>
        <option>Moradia</option>
        <option>Educação</option>
        <option>Dívida</option>
        <option>Outros</option>
      </select>

      <label for="data">Data</label>
      <input id="data" type="date">

      <button onclick="adicionarLancamento()">Adicionar lançamento</button>
    </section>

    <section>
      <h2>Lançamentos</h2>
      <div id="listaLancamentos">
        <p class="vazio">Nenhum lançamento cadastrado.</p>
      </div>
    </section>

    <section>
      <h2>Dívidas e compromissos</h2>

      <label for="nomeDivida">Nome da dívida</label>
      <input id="nomeDivida" type="text" placeholder="Ex.: Joel, Corolla, escola">

      <label for="valorDivida">Valor</label>
      <input id="valorDivida" type="number" step="0.01" placeholder="Ex.: 1000">

      <label for="vencimentoDivida">Vencimento</label>
      <input id="vencimentoDivida" type="date">

      <button onclick="adicionarDivida()">Adicionar dívida</button>

      <div id="listaDividas">
        <p class="vazio">Nenhuma dívida cadastrada.</p>
      </div>
    </section>

    <section>
      <button onclick="apagarTudo()" style="background:#8b0000;">
        Apagar todos os dados
      </button>
    </section>

  </main>

  <script>
    let lancamentos = JSON.parse(localStorage.getItem("lancamentos")) || [];
    let dividas = JSON.parse(localStorage.getItem("dividas")) || [];

    document.getElementById("data").value =
      new Date().toISOString().split("T")[0];

    function formatarMoeda(valor) {
      return Number(valor).toLocaleString("pt-BR", {
        style: "currency",
        currency: "BRL"
      });
    }

    function formatarData(data) {
      if (!data) return "";
      const partes = data.split("-");
      return partes[2] + "/" + partes[1] + "/" + partes[0];
    }

    function salvarDados() {
      localStorage.setItem("lancamentos", JSON.stringify(lancamentos));
      localStorage.setItem("dividas", JSON.stringify(dividas));
    }

    function adicionarLancamento() {
      const descricao = document.getElementById("descricao").value.trim();
      const valor = Number(document.getElementById("valor").value);
      const tipo = document.getElementById("tipo").value;
      const categoria = document.getElementById("categoria").value;
      const data = document.getElementById("data").value;

      if (!descricao || !valor || valor <= 0 || !data) {
        alert("Preencha a descrição, o valor e a data.");
        return;
      }

      lancamentos.push({
        id: Date.now(),
        descricao,
        valor,
        tipo,
        categoria,
        data
      });

      salvarDados();

      document.getElementById("descricao").value = "";
      document.getElementById("valor").value = "";

      atualizarTela();
    }

    function excluirLancamento(id) {
      lancamentos = lancamentos.filter(item => item.id !== id);
      salvarDados();
      atualizarTela();
    }

    function adicionarDivida() {
      const nome = document.getElementById("nomeDivida").value.trim();
      const valor = Number(document.getElementById("valorDivida").value);
      const vencimento = document.getElementById("vencimentoDivida").value;

      if (!nome || !valor || valor <= 0) {
        alert("Preencha o nome e o valor da dívida.");
        return;
      }

      dividas.push({
        id: Date.now(),
        nome,
        valor,
        vencimento
      });

      salvarDados();

      document.getElementById("nomeDivida").value = "";
      document.getElementById("valorDivida").value = "";
      document.getElementById("vencimentoDivida").value = "";

      atualizarTela();
    }

    function excluirDivida(id) {
      dividas = dividas.filter(item => item.id !== id);
      salvarDados();
      atualizarTela();
    }

    function atualizarTela() {
      let receitas = 0;
      let despesas = 0;

      lancamentos.forEach(item => {
        if (item.tipo === "receita") {
          receitas += item.valor;
        } else {
          despesas += item.valor;
        }
      });

      document.getElementById("totalReceitas").textContent =
        formatarMoeda(receitas);

      document.getElementById("totalDespesas").textContent =
        formatarMoeda(despesas);

      document.getElementById("saldoAtual").textContent =
        formatarMoeda(receitas - despesas);

      const listaLancamentos =
        document.getElementById("listaLancamentos");

      if (lancamentos.length === 0) {
        listaLancamentos.innerHTML =
          '<p class="vazio">Nenhum lançamento cadastrado.</p>';
      } else {
        listaLancamentos.innerHTML = "";

        [...lancamentos].reverse().forEach(item => {
          const cor = item.tipo === "receita" ? "receita" : "despesa";
          const sinal = item.tipo === "receita" ? "+" : "-";

          listaLancamentos.innerHTML += `
            <div class="item">
              <div>
                <strong>${item.descricao}</strong>
                <small>
                  ${item.categoria} • ${formatarData(item.data)}
                </small>
              </div>

              <div>
                <strong class="${cor}">
                  ${sinal} ${formatarMoeda(item.valor)}
                </strong>
                <br>
                <button class="btn-excluir"
                  onclick="excluirLancamento(${item.id})">
                  Excluir
                </button>
              </div>
            </div>
          `;
        });
      }

      const listaDividas = document.getElementById("listaDividas");

      if (dividas.length === 0) {
        listaDividas.innerHTML =
          '<p class="vazio">Nenhuma dívida cadastrada.</p>';
      } else {
        listaDividas.innerHTML = "";

        [...dividas].reverse().forEach(item => {
          listaDividas.innerHTML += `
            <div class="item">
              <div>
                <strong>${item.nome}</strong>
                <small>
                  Vencimento: ${item.vencimento
                    ? formatarData(item.vencimento)
                    : "não informado"}
                </small>
              </div>

              <div>
                <strong class="despesa">
                  ${formatarMoeda(item.valor)}
                </strong>
                <br>
                <button class="btn-excluir"
                  onclick="excluirDivida(${item.id})">
                  Excluir
                </button>
              </div>
            </div>
          `;
        });
      }
    }

    function apagarTudo() {
      const confirmar = confirm(
        "Tem certeza que deseja apagar todos os lançamentos e dívidas?"
      );

      if (confirmar) {
        lancamentos = [];
        dividas = [];
        salvarDados();
        atualizarTela();
      }
    }

    atualizarTela();
  </script>

</body>
</html>
